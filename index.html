
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☆★ ﾏｨOC図鑑 ★☆</title>

  <style>
    :root {
      --hot: #ff1493;
      --pink: #ff69b4;
      --light-pink: #ffc0df;
      --black: #160711;
      --white: #fff8fc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--white);
      background-color: var(--black);
      background-image:
        radial-gradient(ellipse at 20% 20%, #ff149922 0 2px, transparent 3px),
        radial-gradient(ellipse at 80% 60%, #ff69b422 0 2px, transparent 3px),
        repeating-linear-gradient(
          135deg,
          #ff14990b 0px,
          #ff14990b 4px,
          transparent 4px,
          transparent 12px
        );
      background-size: 28px 28px, 34px 34px, auto;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-frame {
      width: min(100% - 24px, 1000px);
      margin: 20px auto;
      border: 3px solid var(--hot);
      box-shadow: 0 0 18px #ff149955;
      background: #160711ee;
    }

    header {
      padding: 24px 14px 18px;
      text-align: center;
      background: linear-gradient(135deg, #ff1493, #ff69b4, #ff1493);
      border-bottom: 4px double white;
    }

    .site-title {
      margin: 0;
      color: white;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 1000;
      text-shadow:
        2px 2px 0 #a00055,
        4px 4px 0 #4a0028;
      letter-spacing: 2px;
    }

    .site-subtitle {
      margin: 5px 0 0;
      color: white;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: #260817;
      border-bottom: 2px dashed var(--pink);
    }

    nav a {
      display: inline-block;
      padding: 5px 18px;
      color: white;
      background: var(--hot);
      border: 2px solid white;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 3px 3px 0 #7a003e;
      transition: transform 0.2s;
    }

    nav a:hover {
      transform: translateY(-3px) rotate(-2deg);
    }

    .hero {
      padding: 32px 16px 24px;
      text-align: center;
      background: radial-gradient(circle at center, #ff149928, transparent 70%);
    }

    .hero h2 {
      margin: 0 0 12px;
      color: #ff9ed2;
      font-size: clamp(21px, 4.5vw, 32px);
      font-weight: 1000;
      text-shadow: 2px 2px 0 #8c0046;
    }

    .love-badge {
      display: inline-block;
      padding: 4px 15px;
      color: white;
      background: var(--hot);
      border: 2px solid white;
      outline: 2px dashed var(--pink);
      outline-offset: 3px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* ♡ 平成ギャル風・うちよそバナー ♡ */
    .marquee {
      overflow: hidden;
      white-space: nowrap;
      padding: 11px 0;
      color: white;
      background: var(--hot);
      border-top: 2px dashed white;
      border-bottom: 2px dashed white;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.9;
      text-shadow: 1px 1px 0 #a00055;
    }

    .marquee span {
      display: inline-block;
      white-space: nowrap;
      animation: gyaru-scroll 16s linear infinite;
    }

    @keyframes gyaru-scroll {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100vw);
      }
    }

    .section-title {
      margin: 0;
      padding: 18px 10px;
      color: white;
      text-align: center;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 1000;
      text-shadow: 2px 2px 0 #a00055;
      background: repeating-linear-gradient(
        45deg,
        #ff1493 0px,
        #ff1493 10px,
        #d90079 10px,
        #d90079 20px
      );
      border-top: 3px solid white;
      border-bottom: 3px solid white;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 22px;
    }

    .character-card {
      min-width: 0;
      overflow: hidden;
      color: var(--white);
      background: #260817;
      border: 3px solid var(--pink);
      box-shadow: 4px 4px 0 #850047;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .character-card:hover {
      transform: translateY(-5px) rotate(-1deg);
      box-shadow: 6px 7px 0 #ff149966;
    }

    .character-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      color: white;
      background: repeating-linear-gradient(
        135deg,
        #ff149922 0px,
        #ff149922 8px,
        #160711 8px,
        #160711 16px
      );
      border-bottom: 3px dashed var(--pink);
      font-size: 38px;
    }

    .character-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character-info {
      padding: 10px;
      text-align: center;
    }

    .character-number {
      display: inline-block;
      margin-bottom: 5px;
      padding: 1px 9px;
      color: white;
      background: var(--hot);
      border: 1px solid white;
      font-size: 9px;
      font-weight: 900;
    }

    .character-name {
      margin: 0;
      color: #ff9ed2;
      font-size: clamp(14px, 2.5vw, 20px);
      font-weight: 1000;
      overflow-wrap: anywhere;
    }

    .character-description {
      margin: 5px 0 10px;
      color: #f8c9e3;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .profile-link {
      display: block;
      padding: 6px 4px;
      color: white;
      background: var(--hot);
      border: 1px solid white;
      font-size: 11px;
      font-weight: 900;
    }

    .profile-link:hover {
      color: var(--hot);
      background: white;
    }

    .bottom-deco {
      padding: 18px 10px;
      color: #ff9ed2;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      border-top: 2px dashed var(--pink);
    }

    footer {
      padding: 15px 10px;
      color: white;
      text-align: center;
      background: var(--hot);
      border-top: 3px double white;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    @media (max-width: 650px) {
      .character-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 14px;
      }

      .page-frame {
        width: calc(100% - 14px);
        margin: 10px auto;
      }

      .hero {
        padding: 26px 10px 22px;
      }
    }

    @media (max-width: 360px) {
      .character-grid {
        gap: 8px;
        padding: 10px;
      }

      .character-info {
        padding: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="page-frame">

    <header>
      <h1 class="site-title">☆★ ﾏｨOC図鑑 ★☆</h1>
      <p class="site-subtitle">♡ MY ORIGINAL CHARACTERS ♡</p>
    </header>

    <nav>
      <a href="index.html">♡ TOP ♡</a>
      <a href="characters.html">♡ きゃら一覧 ♡</a>
    </nav>

    <section class="hero">
      <h2>ょぅこそｯ!! ｩﾁのOC図鑑へ♡</h2>
      <span class="love-badge">♡ LOVE MY BABIES ♡</span>
    </section>

    <div class="marquee">
      <span>☆ ぅちょそ大歓迎ｯｯ♡ ぅちょそまｯてるょ〜!! ☆</span>
    </div>

    <h2 class="section-title">♡ きゃらくたぁ一覧ｯ!! ♡</h2>

    <main>
      <div class="character-grid" id="character-grid"></div>
    </main>

    <div class="bottom-deco">
      ☆ﾟ.*･｡ﾟ ♡ LOVE & PEACE ♡ ﾟ｡･*.ﾟ☆
    </div>

    <footer>
      © ﾏｨOC図鑑 ☆ ALL CHARACTERS ARE MINE ♡
    </footer>

  </div>

  <script>
    const characters = [
      {
        id: "001",
        name: "CHARACTER 001",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      },
      {
        id: "002",
        name: "CHARACTER 002",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      },
      {
        id: "003",
        name: "CHARACTER 003",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      },
      {
        id: "004",
        name: "CHARACTER 004",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      },
      {
        id: "005",
        name: "CHARACTER 005",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      },
      {
        id: "006",
        name: "CHARACTER 006",
        description: "♡ ｺｺに紹介文 ♡",
        image: ""
      }
    ];

    const grid = document.getElementById("character-grid");

    function makeText(tag, className, content) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = content;
      return element;
    }

    characters.forEach((character) => {
      const card = document.createElement("article");
      card.className = "character-card";

      const link = document.createElement("a");
      link.href = "profile.html?id=" + encodeURIComponent(character.id);
      link.setAttribute(
        "aria-label",
        character.name + " のプロフィールを見る"
      );

      const imageBox = document.createElement("div");
      imageBox.className = "character-image";

      if (character.image) {
        const img = document.createElement("img");
        img.src = character.image;
        img.alt = character.name;
        img.loading = "lazy";

        img.onerror = () => {
          imageBox.replaceChildren();
          imageBox.textContent = "♡";
        };

        imageBox.appendChild(img);
      } else {
        imageBox.textContent = "♡";
      }

      const info = document.createElement("div");
      info.className = "character-info";

      info.appendChild(
        makeText("span", "character-number", "No. " + character.id)
      );

      info.appendChild(
        makeText("h3", "character-name", character.name)
      );

      info.appendChild(
        makeText("p", "character-description", character.description)
      );

      info.appendChild(
        makeText("span", "profile-link", "♡ PROFILE ♡")
      );

      link.appendChild(imageBox);
      link.appendChild(info);
      card.appendChild(link);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
